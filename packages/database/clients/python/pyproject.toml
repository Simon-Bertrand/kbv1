[project]
name = "dbclient"
version = "0.1.0"
description = "The Python client for the knowledge base RAG database"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["psycopg[binary]>=3.2,<4"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"
