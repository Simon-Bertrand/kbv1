[project]
name = "pdfparse"
version = "0.1.0"
description = "Configurable PDF extraction, enrichment and source-preserving Chonkie chunking"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "tqdm>=4.67,<5",
    "zstandard>=0.25,<0.26",
    "python-dotenv>=1.2,<2",
    "chonkie>=1.7,<2",
    "filelock>=3.32.7,<4",
    "docling>=2.137,<3",
    "docling-core>=2.101.1,<3",
    "huggingface-hub>=0.30,<2",
    "pillow>=11,<13",
    "pydantic>=2.10,<3",
    "torch>=2.10,<3",
    "torchvision>=0.25,<1",
]

[project.entry-points."docling"]
pdfparse_layout = "pdfparse.models.layout.model"

[project.scripts]
pdfparse-run = "pdfparse.cli:main"
pdfparse-cachecheck = "pdfparse.cachecheck.cli:main"
pdfparse-download-models = "pdfparse.models.download:main"
pdfparse-studio = "pdfparse.backend.__main__:main"

[project.optional-dependencies]
studio = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]
layout-lite = ["pdfparse[ocr-paddle]"]
vlm = ["transformers>=5.19,<6", "torch>=2.6,<3"]
quantization = ["bitsandbytes>=0.49,<1", "accelerate>=1,<2"]
cuda-kernels = [
    "causal-conv1d==1.7.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "flash-linear-attention[cuda]==0.6.0; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.12'",
]
ocr-transformers = ["transformers>=5.19,<6", "torch>=2.6,<3"]
ocr-paddle = [
    "paddleocr>=3.7,<4",
    "paddlepaddle-gpu>=3.3,<4; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.12'",
]
ocr-rapid = ["rapidocr>=3.10,<4", "onnxruntime>=1.23,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "reportlab>=4,<6", "httpx>=0.28,<1", "pypdf>=6.20,<7"]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-exclude = ["node_modules", "playwright-report", "test-results"]

[tool.pytest.ini_options]
pythonpath = ["src", "../../ressources"]
testpaths = ["tests"]

# uv uses root settings in a workspace; keep these declarations for standalone installs.
[tool.uv]

[tool.uv.sources]
paddlepaddle-gpu = { index = "paddle-cu118" }
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "paddle-cu118"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu118/"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
