            # NGINX error diagnostics may include the raw bearer query.
            # Keep ordinary file/auth failures in the sanitized access log.
            error_log /dev/stderr crit;
            default_type application/json;
            add_header WWW-Authenticate $file_authenticate always;
            add_header X-Token-Status $file_token_status always;
            add_header Referrer-Policy no-referrer always;
            add_header X-Request-Id $effective_request_id always;
            # Preflight carries no resource bytes or credentials.
            if ($request_method = OPTIONS) { return 204; }
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Vary Origin always;
            add_header Access-Control-Expose-Headers 'Content-Range, Accept-Ranges, Content-Length, X-Token-Status, WWW-Authenticate, X-Request-Id' always;
            add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'Range, If-Range, If-None-Match, Authorization' always;
            if ($file_auth = 'missing') {
                return 401 '{"error":"missing_token"}\n';
            }
            if ($file_auth = 'expired') {
                return 401 '{"error":"token_expired"}\n';
            }
            if ($file_auth = 'tampered') {
                return 403 '{"error":"invalid_signature"}\n';
            }
            if ($file_auth = 'forbidden_path') {
                return 403 '{"error":"forbidden_path"}\n';
            }
            if ($file_auth = 'forbidden_origin') {
                return 403 '{"error":"forbidden_origin"}\n';
            }
            if ($file_auth != 'ok') {
                return 403 '{"error":"forbidden"}\n';
            }

            limit_conn file_conns 10;
            limit_req zone=files_requests burst=20 nodelay;

            autoindex off;
            index __STATICZIP_NO_DIRECTORY_INDEX__.html;
            disable_symlinks on;
            sendfile on;
            max_ranges 16;
            open_file_cache max=10000 inactive=20s;
            open_file_cache_valid 5s;
            open_file_cache_min_uses 2;
            open_file_cache_errors off;
            add_header Cache-Control 'private, no-cache';
            add_header X-Content-Type-Options nosniff always;
            add_header Content-Security-Policy "default-src 'none'; sandbox; frame-ancestors 'self';" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
