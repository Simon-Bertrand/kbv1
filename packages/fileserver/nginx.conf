load_module /usr/lib/nginx/modules/ngx_http_zip_module.so;
load_module /usr/lib/nginx/modules/ngx_http_js_module.so;

user nginx;
env ALLOWED_HOSTS;
env FILESERVER_JWT_SECRET;
env FILESERVER_UI_SECRET;
env FILESERVER_DEV_USER;
env FILESERVER_DEV_PASSWORD;
env KB_ENV;
env WEBUI_PUBLIC_ORIGIN;
env FILESERVER_LOG_PROXY_IPS;
env FILESERVER_LEGACY_VERSIONS_ROOT;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    map $http_x_request_id $client_request_id {
        default $request_id;
        "~^[A-Za-z0-9._-]{1,128}$" $http_x_request_id;
    }
    map $verified_jwt_request_id $effective_request_id {
        "" $client_request_id;
        default $verified_jwt_request_id;
    }

    map $file_auth $file_authenticate {
        default "";
        missing 'Bearer error="missing_token"';
        expired 'Bearer error="token_expired"';
    }
    map $file_auth $file_token_status { default ""; expired "expired"; }

    js_import explorer from /etc/nginx/njs/explorer.js;
    js_set $allowed_host explorer.allowedHost;
    js_set $file_auth explorer.checkFileAuth;
    js_set $legacy_versions_root explorer.legacyVersionsRoot;
    js_set $ui_auth explorer.checkUiAuth;
    js_set $ui_cookie explorer.generateUiCookie;
    js_set $ui_login_status explorer.checkDevLogin;
    js_set $verified_user explorer.getVerifiedUser;
    js_set $logged_client_ip explorer.getLogClientIp;
    js_set $duration_ms explorer.getDurationMs;
    js_set $cors_origin explorer.allowedOrigin;
    # JSON generated by autoindex can exceed the tiny default subrequest buffer.
    subrequest_output_buffer_size 4m;

    # Rate & Connection Limiting
    limit_req_zone $binary_remote_addr zone=zip_requests:10m rate=2r/s;
    limit_req_zone $binary_remote_addr zone=files_requests:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=dev_login_req:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=file_conns:10m;
    limit_req_status 429;
    limit_conn_status 429;

    # $uri excludes bearer query parameters. request_time is expressed in seconds.
    log_format json_log escape=json '{"timestamp":"$time_iso8601","level":"INFO","service":"fileserver","logger":"nginx.access","message":"$request_method $uri","request_id":"$effective_request_id","client_ip":"$logged_client_ip","user":"$verified_user","method":"$request_method","path":"$uri","status_code":$status,"duration_ms":$duration_ms,"bytes":$body_bytes_sent}';

    access_log /dev/stdout json_log;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 60s;
    etag on;
    gzip off;  # Range on raw content remains straightforward.

    server {
        listen 8080;
        server_name _;
        location = /health { access_log off; return 200 "OK\n"; }
        if ($allowed_host = 0) { return 400; }
        server_tokens off;

        set $verified_jwt_user 'anonymous';
        set $verified_jwt_request_id '';

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Request-Id $effective_request_id always;

        # IMPORTANT: these regex locations must be able to override the plain
        # /files/, /_index/, /_zipfiles/ prefixes (do NOT mark those ^~).
        # Any path COMPONENT containing .pdfparsecache is inaccessible.
        location ~ /[^/]*[.]pdfparsecache[^/]*(/|$) { return 404; }
        # Conservatively deny all dotfile/dotfolder path components as well.
        location ~ /[.][^/]+(/|$) { return 404; }

        # Raw directory listings are internal, filtered by njs before being
        # exposed through /api/list. A sentinel index avoids index.html in data.
        location /_index/ {
            internal;
            alias /srv/data/;
            autoindex on;
            autoindex_format json;
            index __STATICZIP_DO_NOT_CREATE_THIS_INDEX_FILE__.html;
            disable_symlinks on;
        }

        # mod_zip internal subrequests read file bytes from here.
        location /_zipfiles/ {
            internal;
            alias /srv/data/;
            autoindex off;
            disable_symlinks on;
            sendfile on;
        }

        location = /api/list {
            if ($ui_auth != 'ok') {
                add_header Content-Type 'application/json' always;
                return 403 '{"error":"ui_session_required"}\n';
            }
            js_content explorer.list;
        }

        location = /api/zip {
            if ($ui_auth != 'ok') {
                add_header Content-Type 'application/json' always;
                return 403 '{"error":"ui_session_required"}\n';
            }
            limit_req zone=zip_requests burst=3 nodelay;
            js_content explorer.zip;
        }

        # Files served by nginx itself: Range/206, HEAD, ETag, sendfile.
        # Sign the logical PDF path and its content hash, then serve only the archived bytes.
        location ~ "^/files/_versions/(?<versioned_pdf>.+(?i:\.pdf))/(?<version_file>[a-f0-9]{64}\.pdf)$" {
            alias /srv/data/${versioned_pdf}.pdfparsecache/versions/$version_file;
            include /etc/nginx/file-delivery.conf;
        }
        location /files/_versions/ {
            alias $legacy_versions_root/;
            include /etc/nginx/file-delivery.conf;
        }
        location /files/ {
            alias /srv/data/;
            include /etc/nginx/file-delivery.conf;
        }

        # Explicit root route with dev basic auth challenge & prod deactivation.
        location = / {
            limit_req zone=dev_login_req burst=10 nodelay;
            if ($ui_login_status = 'disabled') {
                add_header Content-Type 'application/json' always;
                return 403 '{"error":"ui_disabled_in_production"}\n';
            }
            if ($ui_login_status = 'challenge') {
                add_header WWW-Authenticate 'Basic realm="Fileserver Dev Console"' always;
                add_header Content-Type 'application/json' always;
                return 401 '{"error":"authentication_required","message":"Authentification requise pour la console Fileserver Dev (ex: dev/dev)"}\n';
            }
            root /usr/share/nginx/html;
            add_header Set-Cookie $ui_cookie always;
            add_header Cache-Control 'private, no-cache';
            try_files /index.html =404;
        }

        # No SPA fallback: missing assets must return 404.
        location / {
            root /usr/share/nginx/html;
            try_files $uri =404;
        }
    }
    # Container-local probe is independent of the public Host allowlist.
    server {
        listen 127.0.0.1:8081;
        server_name localhost;
        access_log off;
        location = /health { return 200 "OK\n"; }
        location / { return 404; }
    }
}
