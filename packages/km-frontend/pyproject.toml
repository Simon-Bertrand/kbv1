[project]
name = "km-frontend"
version = "0.1.0"
description = "FastAPI proxy server and administration console for KM"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anyio>=4,<5",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["server.py", "km_frontend_logging.py"]


[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
