{{- if .Values.webui.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kbv1-frontends.fullname" . }}-webui
  labels:
    {{- include "kbv1-frontends.labels" . | nindent 4 }}
    app.kubernetes.io/component: webui
spec:
  replicas: {{ .Values.webui.replicaCount }}
  selector:
    matchLabels:
      {{- include "kbv1-frontends.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: webui
  template:
    metadata:
      labels:
        {{- include "kbv1-frontends.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: webui
    spec:
      containers:
        - name: webui
          image: "{{ .Values.webui.image.repository }}:{{ .Values.webui.image.tag }}"
          imagePullPolicy: {{ .Values.webui.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 4173
              protocol: TCP
          env:
            - name: KB_ENV
              value: {{ .Values.global.environment | default "dev" | quote }}
            - name: NODE_ENV
              value: {{ .Values.webui.env.nodeEnv | default "production" | quote }}
            - name: PORT
              value: "4173"
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: WEBUI_DATABASE_URL
              value: {{ .Values.webui.env.databaseUrl | quote }}
            - name: WEBUI_KM_API_URL
              value: {{ .Values.webui.env.kmApiUrl | quote }}
            - name: WEBUI_AGENT_URL
              value: {{ .Values.webui.env.agentUrl | quote }}
            - name: WEBUI_RERANKER_URL
              value: {{ .Values.webui.env.rerankerUrl | quote }}
            - name: WEBUI_CHAT_SECONDS
              value: {{ .Values.webui.env.chatSeconds | quote }}
            - name: WEBUI_SEARCH_MODE
              value: {{ .Values.webui.env.searchMode | quote }}
            - name: WEBUI_AUTH_URL
              value: {{ .Values.webui.env.authUrl | quote }}
            - name: WEBUI_AUTH_TRUST_HOST
              value: {{ .Values.webui.env.authTrustHost | quote }}
            - name: WEBUI_TRUST_PROXY
              value: {{ .Values.webui.env.trustProxy | quote }}
            - name: FILESERVER_INTERNAL_URL
              value: {{ .Values.webui.env.fileserverInternalUrl | quote }}
            - name: FILESERVER_PUBLIC_URL
              value: {{ .Values.webui.env.fileserverPublicUrl | quote }}
            - name: WEBUI_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.secrets.existingSecret }}{{ .Values.secrets.existingSecret }}{{ else }}{{ include "kbv1-frontends.fullname" . }}-secrets{{ end }}
                  key: webuiAuthSecret
            - name: FILESERVER_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.secrets.existingSecret }}{{ .Values.secrets.existingSecret }}{{ else }}{{ include "kbv1-frontends.fullname" . }}-secrets{{ end }}
                  key: fileserverJwtSecret
            - name: KM_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.secrets.existingSecret }}{{ .Values.secrets.existingSecret }}{{ else }}{{ include "kbv1-frontends.fullname" . }}-secrets{{ end }}
                  key: kmApiToken
            - name: KM_AGENT_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.secrets.existingSecret }}{{ .Values.secrets.existingSecret }}{{ else }}{{ include "kbv1-frontends.fullname" . }}-secrets{{ end }}
                  key: kmAgentToken
          livenessProbe:
            {{- toYaml .Values.webui.probes.liveness | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.webui.probes.readiness | nindent 12 }}
          resources:
            {{- toYaml .Values.webui.resources | nindent 12 }}
{{- end }}
