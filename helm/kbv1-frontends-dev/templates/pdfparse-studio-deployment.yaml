{{- if .Values.pdfparseStudio.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kbv1-frontends.fullname" . }}-pdfparse-studio
  labels:
    {{- include "kbv1-frontends.labels" . | nindent 4 }}
    app.kubernetes.io/component: pdfparse-studio
spec:
  replicas: {{ .Values.pdfparseStudio.replicaCount }}
  selector:
    matchLabels:
      {{- include "kbv1-frontends.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: pdfparse-studio
  template:
    metadata:
      labels:
        {{- include "kbv1-frontends.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: pdfparse-studio
    spec:
      containers:
        - name: pdfparse-studio
          image: "{{ .Values.pdfparseStudio.image.repository }}:{{ .Values.pdfparseStudio.image.tag }}"
          imagePullPolicy: {{ .Values.pdfparseStudio.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: KB_ENV
              value: {{ .Values.global.environment | default "dev" | quote }}
            - name: ALLOWED_HOSTS
              value: {{ .Values.pdfparseStudio.env.allowedHosts | quote }}
            - name: MODELS_DIR
              value: {{ .Values.pdfparseStudio.env.modelsDir | quote }}
            - name: DATA_DIR
              value: {{ .Values.pdfparseStudio.env.dataDir | quote }}
            - name: PDFPARSE_ADMIN_USER
              value: {{ .Values.pdfparseStudio.env.adminUser | quote }}
            - name: PDFPARSE_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.secrets.existingSecret }}{{ .Values.secrets.existingSecret }}{{ else }}{{ include "kbv1-frontends.fullname" . }}-secrets{{ end }}
                  key: pdfparseAdminPassword
          volumeMounts:
            - name: assets-storage
              mountPath: {{ .Values.pdfparseStudio.persistence.assets.mountPath }}
            {{- if .Values.pdfparseStudio.persistence.data.enabled }}
            - name: data-storage
              mountPath: {{ .Values.pdfparseStudio.persistence.data.mountPath }}
            {{- end }}
            {{- if .Values.pdfparseStudio.persistence.models.enabled }}
            - name: models-storage
              mountPath: {{ .Values.pdfparseStudio.persistence.models.mountPath }}
              readOnly: true
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.pdfparseStudio.probes.liveness | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.pdfparseStudio.probes.readiness | nindent 12 }}
          resources:
            {{- toYaml .Values.pdfparseStudio.resources | nindent 12 }}
            {{- if .Values.pdfparseStudio.gpu.enabled }}
            limits:
              nvidia.com/gpu: {{ .Values.pdfparseStudio.gpu.count | quote }}
            {{- end }}
      volumes:
        - name: assets-storage
          {{- if eq .Values.pdfparseStudio.persistence.assets.type "pvc" }}
          persistentVolumeClaim:
            claimName: {{ .Values.pdfparseStudio.persistence.assets.pvcName }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.pdfparseStudio.persistence.data.enabled }}
        - name: data-storage
          {{- if eq .Values.pdfparseStudio.persistence.data.type "pvc" }}
          persistentVolumeClaim:
            claimName: {{ .Values.pdfparseStudio.persistence.data.pvcName }}
          {{- else if eq .Values.pdfparseStudio.persistence.data.type "hostPath" }}
          hostPath:
            path: {{ .Values.pdfparseStudio.persistence.data.hostPath }}
            type: Directory
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
        {{- if .Values.pdfparseStudio.persistence.models.enabled }}
        - name: models-storage
          {{- if eq .Values.pdfparseStudio.persistence.models.type "pvc" }}
          persistentVolumeClaim:
            claimName: {{ .Values.pdfparseStudio.persistence.models.pvcName }}
          {{- else if eq .Values.pdfparseStudio.persistence.models.type "hostPath" }}
          hostPath:
            path: {{ .Values.pdfparseStudio.persistence.models.hostPath }}
            type: Directory
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
{{- end }}
