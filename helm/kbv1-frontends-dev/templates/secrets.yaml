{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kbv1-frontends.fullname" . }}-secrets
  labels:
    {{- include "kbv1-frontends.labels" . | nindent 4 }}
type: Opaque
stringData:
  kmConsolePassword: {{ .Values.secrets.kmConsolePassword | default "" | quote }}
  fileserverDevPassword: {{ .Values.secrets.fileserverDevPassword | default "dev" | quote }}
  pdfparseAdminPassword: {{ .Values.secrets.pdfparseAdminPassword | default "dev-studio-password" | quote }}
  webuiAuthSecret: {{ .Values.secrets.webuiAuthSecret | default "dev-secret-super-secure-at-least-32-chars-long" | quote }}
  fileserverJwtSecret: {{ .Values.secrets.fileserverJwtSecret | default "dev-fileserver-jwt-secret-at-least-32-chars" | quote }}
  kmApiToken: {{ .Values.secrets.kmApiToken | default "" | quote }}
  kmIndexerToken: {{ .Values.secrets.kmIndexerToken | default "" | quote }}
  kmAgentToken: {{ .Values.secrets.kmAgentToken | default "" | quote }}
{{- end }}
