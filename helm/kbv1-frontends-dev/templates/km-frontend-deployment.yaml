{{- if .Values.kmFrontend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kbv1-frontends.fullname" . }}-km-frontend
  labels:
    {{- include "kbv1-frontends.labels" . | nindent 4 }}
    app.kubernetes.io/component: km-frontend
spec:
  replicas: {{ .Values.kmFrontend.replicaCount }}
  selector:
    matchLabels:
      {{- include "kbv1-frontends.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: km-frontend
  template:
    metadata:
      labels:
        {{- include "kbv1-frontends.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: km-frontend
    spec:
      containers:
        - name: km-frontend
          image: "{{ .Values.kmFrontend.image.repository }}:{{ .Values.kmFrontend.image.tag }}"
          imagePullPolicy: {{ .Values.kmFrontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8088
              protocol: TCP
          env:
            - name: KB_ENV
              value: {{ .Values.global.environment | default "dev" | quote }}
            - name: FRONTEND_RAG_URL
              value: {{ .Values.kmFrontend.env.ragUrl | quote }}
            - name: FRONTEND_KB_URL
              value: {{ .Values.kmFrontend.env.kbUrl | quote }}
            - name: FRONTEND_INDEX_URL
              value: {{ .Values.kmFrontend.env.indexUrl | quote }}
            - name: FRONTEND_FILESERVER_URL
              value: {{ .Values.kmFrontend.env.fileserverUrl | quote }}
            - name: FRONTEND_AGENT_URL
              value: {{ .Values.kmFrontend.env.agentUrl | quote }}
            - name: PDFPARSE_PORT
              value: {{ .Values.kmFrontend.env.pdfparsePort | quote }}
            - name: KM_CONSOLE_USER
              value: {{ .Values.kmFrontend.env.consoleUser | quote }}
            - name: KM_CONSOLE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.secrets.existingSecret }}{{ .Values.secrets.existingSecret }}{{ else }}{{ include "kbv1-frontends.fullname" . }}-secrets{{ end }}
                  key: kmConsolePassword
            - name: FILESERVER_DEV_USER
              value: {{ .Values.kmFrontend.env.fileserverDevUser | quote }}
            - name: FILESERVER_DEV_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.secrets.existingSecret }}{{ .Values.secrets.existingSecret }}{{ else }}{{ include "kbv1-frontends.fullname" . }}-secrets{{ end }}
                  key: fileserverDevPassword
            - name: KM_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.secrets.existingSecret }}{{ .Values.secrets.existingSecret }}{{ else }}{{ include "kbv1-frontends.fullname" . }}-secrets{{ end }}
                  key: kmApiToken
            - name: KM_INDEXER_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.secrets.existingSecret }}{{ .Values.secrets.existingSecret }}{{ else }}{{ include "kbv1-frontends.fullname" . }}-secrets{{ end }}
                  key: kmIndexerToken
          livenessProbe:
            {{- toYaml .Values.kmFrontend.probes.liveness | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.kmFrontend.probes.readiness | nindent 12 }}
          resources:
            {{- toYaml .Values.kmFrontend.resources | nindent 12 }}
{{- end }}
