{{- if .Values.pdfparseStudio.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kbv1-frontends.fullname" . }}-pdfparse-studio
  labels:
    {{- include "kbv1-frontends.labels" . | nindent 4 }}
    app.kubernetes.io/component: pdfparse-studio
spec:
  type: {{ .Values.pdfparseStudio.service.type }}
  ports:
    - port: {{ .Values.pdfparseStudio.service.port }}
      targetPort: 8000
      protocol: TCP
      name: http
      {{- if and (eq .Values.pdfparseStudio.service.type "NodePort") .Values.pdfparseStudio.service.nodePort }}
      nodePort: {{ .Values.pdfparseStudio.service.nodePort }}
      {{- end }}
  selector:
    {{- include "kbv1-frontends.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: pdfparse-studio
{{- end }}
