{{- if .Values.kmApi.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kbv1.fullname" . }}-km-api
  labels:
    {{- include "kbv1.labels" . | nindent 4 }}
    app.kubernetes.io/component: km-api
spec:
  type: {{ .Values.kmApi.service.type }}
  ports:
    - port: {{ .Values.kmApi.service.port }}
      targetPort: 8000
      protocol: TCP
      name: http
      {{- if and (eq .Values.kmApi.service.type "NodePort") .Values.kmApi.service.nodePort }}
      nodePort: {{ .Values.kmApi.service.nodePort }}
      {{- end }}
  selector:
    {{- include "kbv1.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: km-api
{{- end }}
