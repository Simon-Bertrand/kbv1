{{- if .Values.kmFrontend.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kbv1.fullname" . }}-km-frontend
  labels:
    {{- include "kbv1.labels" . | nindent 4 }}
    app.kubernetes.io/component: km-frontend
spec:
  type: {{ .Values.kmFrontend.service.type }}
  ports:
    - port: {{ .Values.kmFrontend.service.port }}
      targetPort: 8088
      protocol: TCP
      name: http
      {{- if and (eq .Values.kmFrontend.service.type "NodePort") .Values.kmFrontend.service.nodePort }}
      nodePort: {{ .Values.kmFrontend.service.nodePort }}
      {{- end }}
  selector:
    {{- include "kbv1.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: km-frontend
{{- end }}
