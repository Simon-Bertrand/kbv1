{{- if .Values.pdfparse.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kbv1.fullname" . }}-pdfparse
  labels:
    {{- include "kbv1.labels" . | nindent 4 }}
    app.kubernetes.io/component: pdfparse
spec:
  replicas: 1
  {{- if .Values.pdfparse.gpu.enabled }}
  # Libère le GPU de l'ancien pod avant de lancer le nouveau.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "kbv1.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: pdfparse
  template:
    metadata:
      labels:
        {{- include "kbv1.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: pdfparse
    spec:
      # Empêche le montage automatique d’un jeton d’accès à l’API Kubernetes.
      automountServiceAccountToken: false
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.pdfparse.s3Sync }}
      {{- if .prefix }}
      initContainers:
        - name: s3-ingest
          image: {{ default (printf "%s/aws-cli:2" (trimSuffix "/" $.Values.global.imageRegistry)) .image | quote }}
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          envFrom:
            - secretRef:
                name: {{ required "Renseigner pdfparse.s3Sync.existingSecret" .existingSecret | quote }}
                optional: true
          env:
            - name: HOME
              value: /tmp
            - name: AWS_PAGER
              value: ""
            - name: S3_PREFIX
              value: {{ .prefix | quote }}
            - name: S3_SYNC_REVISION
              value: {{ .revision | quote }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              if [ "${KM_SKIP_MOUNTSYNC:-0}" = 1 ]; then
                echo "Synchronisation S3 désactivée"
                exit 0
              fi
              case "$S3_PREFIX" in s3://?*) ;; *) echo "S3_PREFIX doit commencer par s3://" >&2; exit 1 ;; esac
              sync_prefix() (
                source="${S3_PREFIX%/}/$1/"
                marker="$2/.kbv1-s3-sync"
                if [ -r "$marker" ] && {
                  IFS= read -r synced_source && IFS= read -r synced_revision
                } < "$marker" && [ "$synced_source" = "$source" ] && [ "$synced_revision" = "$S3_SYNC_REVISION" ]; then
                  echo "$2 déjà synchronisé"
                  exit 0
                fi
                : "${AWS_ACCESS_KEY_ID:?Renseigner AWS_ACCESS_KEY_ID dans le Secret S3}"
                : "${AWS_SECRET_ACCESS_KEY:?Renseigner AWS_SECRET_ACCESS_KEY dans le Secret S3}"
                aws s3 sync "$source" "$2/" --exclude '.kbv1-s3-sync*' \
                  --exact-timestamps --checksum-mode ENABLED --no-follow-symlinks --no-progress
                temporary=$(mktemp "$marker.XXXXXX")
                trap 'rm -f "$temporary"' EXIT
                printf '%s\n' "$source" "$S3_SYNC_REVISION" > "$temporary"
                mv -f "$temporary" "$marker"
              )
              sync_prefix documents /data
              sync_prefix modeles /models
          volumeMounts:
            - name: corpus-storage
              mountPath: /data
            - name: models-storage
              mountPath: /models
      {{- end }}
      {{- end }}
      containers:
        - name: pdfparse
          image: {{ include "kbv1.image" (dict "root" . "image" .Values.pdfparse.image) | quote }}
          imagePullPolicy: {{ .Values.pdfparse.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: KB_ENV
              value: {{ .Values.global.environment | quote }}
            - name: ALLOWED_HOSTS
              value: {{ default (include "kbv1.host" (dict "root" . "name" "pdfparseStudio")) .Values.pdfparse.env.allowedHosts | quote }}
            - name: MODELS_DIR
              value: {{ .Values.pdfparse.env.modelsDir | quote }}
            - name: DATA_DIR
              value: {{ .Values.pdfparse.env.dataDir | quote }}
            - name: PDFPARSE_ASSETS_DIR
              value: /assets
            - name: PDFPARSE_ADMIN_USER
              value: {{ .Values.pdfparse.env.adminUser | quote }}
            - name: PDFPARSE_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "kbv1.secretName" . }}
                  key: PDFPARSE_ADMIN_PASSWORD
          volumeMounts:
            - name: corpus-storage
              mountPath: {{ .Values.pdfparse.env.dataDir }}
            - name: models-storage
              mountPath: {{ .Values.pdfparse.env.modelsDir }}
              readOnly: true
            - name: assets-storage
              mountPath: /assets
          livenessProbe:
            # Vérifie que l’application écoute sans fournir d’identifiants HTTP.
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            # Vérifie que l’application écoute sans fournir d’identifiants HTTP.
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- $resources := deepCopy .Values.pdfparse.resources }}
            {{- if .Values.pdfparse.gpu.enabled }}
            {{- /* Réserve exactement un GPU sans supprimer les demandes CPU et RAM. */ -}}
            {{- $resources = mergeOverwrite $resources (dict "requests" (dict "nvidia.com/gpu" 1) "limits" (dict "nvidia.com/gpu" 1)) }}
            {{- end }}
            {{- toYaml $resources | nindent 12 }}
      volumes:
        - name: corpus-storage
          {{- if eq .Values.sharedStorage.corpus.type "pvc" }}
          persistentVolumeClaim:
            # Sélectionne le PVC fourni ou le nom généré par la release.
            claimName: {{ if .Values.sharedStorage.corpus.pvcName }}{{ .Values.sharedStorage.corpus.pvcName }}{{ else }}{{ include "kbv1.fullname" . }}-corpus{{ end }}
          {{- else if eq .Values.sharedStorage.corpus.type "hostPath" }}
          hostPath:
            path: {{ .Values.sharedStorage.corpus.hostPath }}
            type: Directory
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: models-storage
          {{- if eq .Values.sharedStorage.models.type "pvc" }}
          persistentVolumeClaim:
            # Sélectionne le PVC fourni ou le nom généré par la release.
            claimName: {{ if .Values.sharedStorage.models.pvcName }}{{ .Values.sharedStorage.models.pvcName }}{{ else }}{{ include "kbv1.fullname" . }}-models{{ end }}
          {{- else if eq .Values.sharedStorage.models.type "hostPath" }}
          hostPath:
            path: {{ .Values.sharedStorage.models.hostPath }}
            type: Directory
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: assets-storage
          {{- if eq .Values.sharedStorage.pdfparseAssets.type "pvc" }}
          persistentVolumeClaim:
            # Sélectionne le PVC fourni ou le nom généré par la release.
            claimName: {{ if .Values.sharedStorage.pdfparseAssets.pvcName }}{{ .Values.sharedStorage.pdfparseAssets.pvcName }}{{ else }}{{ include "kbv1.fullname" . }}-pdfparse-assets{{ end }}
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- end }}
