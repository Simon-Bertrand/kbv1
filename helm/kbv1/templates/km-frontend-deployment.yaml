{{- if .Values.kmFrontend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kbv1.fullname" . }}-km-frontend
  labels:
    {{- include "kbv1.labels" . | nindent 4 }}
    app.kubernetes.io/component: km-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "kbv1.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: km-frontend
  template:
    metadata:
      labels:
        {{- include "kbv1.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: km-frontend
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: km-frontend
          image: {{ include "kbv1.image" (dict "root" . "image" .Values.kmFrontend.image) | quote }}
          imagePullPolicy: {{ .Values.kmFrontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8088
              protocol: TCP
          env:
            - name: KB_ENV
              value: {{ .Values.global.environment | default "dev" | quote }}
            - name: FRONTEND_RAG_URL
              value: {{ printf "http://%s-km-api:8000" (include "kbv1.fullname" .) | quote }}
            - name: FRONTEND_KB_URL
              value: {{ printf "http://%s-km-api:8000" (include "kbv1.fullname" .) | quote }}
            - name: FRONTEND_INDEX_URL
              value: {{ printf "http://%s-indexer:8011" (include "kbv1.fullname" .) | quote }}
            - name: FRONTEND_FILESERVER_URL
              value: {{ printf "http://%s-fileserver:8080" (include "kbv1.fullname" .) | quote }}
            - name: FRONTEND_AGENT_URL
              value: {{ .Values.kmFrontend.env.agentUrl | quote }}
            - name: PDFPARSE_PORT
              value: {{ .Values.kmFrontend.env.pdfparsePort | quote }}
            - name: KM_CONSOLE_USER
              value: {{ default .Values.kmFrontend.env.consoleUser .Values.basicAuth.kmFrontend.user | quote }}
            - name: KM_CONSOLE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "kbv1.secretName" . }}
                  key: KM_CONSOLE_PASSWORD
            - name: FILESERVER_DEV_USER
              value: {{ default .Values.kmFrontend.env.fileserverDevUser .Values.basicAuth.fileserver.user | quote }}
            - name: FILESERVER_DEV_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "kbv1.secretName" . }}
                  key: FILESERVER_DEV_PASSWORD
            - name: KM_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "kbv1.secretName" . }}
                  key: KM_API_TOKEN
            - name: KM_INDEXER_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "kbv1.secretName" . }}
                  key: KM_INDEXER_TOKEN
          livenessProbe:
            httpGet:
              path: /health
              port: 8088
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8088
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.kmFrontend.resources | nindent 12 }}
{{- end }}
