{{- /* Rend cette ressource uniquement si la fonctionnalité est activée. */ -}}
{{- if .Values.kmFrontend.enabled }}
# Version de l’API utilisée pour cette ressource.
apiVersion: apps/v1
# Type de ressource que Kubernetes doit créer.
kind: Deployment
# Identité et étiquettes de la ressource.
metadata:
  # Nom de la ressource dans le namespace de la release.
  name: {{ include "kbv1.fullname" . }}-km-frontend
  # Étiquettes Helm et identité de la release.
  labels:
    {{- include "kbv1.labels" . | nindent 4 }}
    # Étiquette qui distingue ce composant des autres pods de la release.
    app.kubernetes.io/component: km-frontend
# Configuration souhaitée pour cette ressource.
spec:
  # Nombre de pods maintenus par le Deployment.
  replicas: 1
  # Étiquettes des pods que cette ressource sélectionne.
  selector:
    # Toutes ces étiquettes doivent correspondre au pod ciblé.
    matchLabels:
      {{- include "kbv1.selectorLabels" . | nindent 6 }}
      # Étiquette qui distingue ce composant des autres pods de la release.
      app.kubernetes.io/component: km-frontend
  # Modèle de pod appliqué à chaque réplique.
  template:
    # Identité et étiquettes de la ressource.
    metadata:
      # Étiquettes Helm et identité de la release.
      labels:
        {{- include "kbv1.selectorLabels" . | nindent 8 }}
        # Étiquette qui distingue ce composant des autres pods de la release.
        app.kubernetes.io/component: km-frontend
    # Configuration souhaitée pour cette ressource.
    spec:
      # Empêche le montage automatique d’un jeton d’accès à l’API Kubernetes.
      automountServiceAccountToken: false
      {{- /* Ajoute les Secrets de lecture du registre uniquement lorsqu’ils sont fournis. */ -}}
      {{- with .Values.global.imagePullSecrets }}
      # Secrets Docker utilisés par le kubelet pour accéder au registre privé.
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Conteneurs applicatifs du pod.
      containers:
        # Nom du conteneur dans le pod.
        - name: km-frontend
          # Référence de l’image publiée par GitLab, avec le registre et le tag de la release.
          image: {{ include "kbv1.image" (dict "root" . "image" .Values.kmFrontend.image) | quote }}
          # Détermine quand le kubelet télécharge de nouveau l’image.
          imagePullPolicy: {{ .Values.kmFrontend.image.pullPolicy }}
          # Commande lancée dans le conteneur pour ce bloc.
          command: ["/bin/sh", "-ec"]
          # Arguments ou script transmis à la commande.
          args:
            - |
              if [ "${#KM_CONSOLE_PASSWORD}" -lt 16 ]; then
                echo "KM_CONSOLE_PASSWORD doit contenir au moins 16 caractères" >&2
                exit 1
              fi
              case "$KM_CONSOLE_PASSWORD" in
                [[:space:]]*|*[[:space:]]) exit 1 ;;
              esac
              exec python -m uvicorn server:app --host 0.0.0.0 --port 8088 --proxy-headers --forwarded-allow-ips '*'
          # Ports utilisés par cette ressource.
          ports:
            # Nom du port de conteneur, réutilisable par les sondes et le Service.
            - name: http
              # Port d’écoute déclaré par le conteneur.
              containerPort: 8088
              # Protocole de transport du port.
              protocol: TCP
          # Variables injectées dans le conteneur au démarrage.
          env:
            # Mode d’exécution applicatif. Le Fileserver et la console KM utilisent dev lorsque l’explorateur est publié.
            - name: KB_ENV
              value: {{ ternary "dev" "production" (and .Values.ingress.enabled .Values.fileserver.enabled .Values.ingress.fileserverExposed .Values.ingress.fileserverUi.enabled) | quote }}
            # Endpoint interne de recherche et de récupération documentaire.
            - name: FRONTEND_RAG_URL
              value: {{ printf "http://%s-km-api:%v" (include "kbv1.fullname" .) .Values.kmApi.service.port | quote }}
            # Endpoint interne de consultation des documents dans KM API.
            - name: FRONTEND_KB_URL
              value: {{ printf "http://%s-km-api:%v" (include "kbv1.fullname" .) .Values.kmApi.service.port | quote }}
            # Endpoint interne d’administration et de suivi de l’indexation.
            - name: FRONTEND_INDEX_URL
              value: {{ printf "http://%s-indexer:%v" (include "kbv1.fullname" .) .Values.indexer.service.port | quote }}
            # Endpoint interne pour les requêtes documentaires depuis la console KM.
            - name: FRONTEND_FILESERVER_URL
              value: {{ printf "http://%s-fileserver:%v" (include "kbv1.fullname" .) .Values.fileserver.service.port | quote }}
            # Endpoint de l’agent facultatif utilisé par la console KM.
            - name: FRONTEND_AGENT_URL
              value: {{ .Values.kmFrontend.env.agentUrl | quote }}
            # Endpoint facultatif de gestion du pipeline d’ingestion.
            - name: FRONTEND_INGESTION_URL
              value: {{ .Values.kmFrontend.env.ingestionUrl | quote }}
            {{- /* Injecte le jeton Agent uniquement si l’URL du service est configurée. */ -}}
            {{- if .Values.kmFrontend.env.agentUrl }}
            # Injecte KM_AGENT_ADMIN_TOKEN depuis le Secret runtime.
            - name: KM_AGENT_ADMIN_TOKEN
              # Source de cette variable, résolue par Kubernetes.
              valueFrom:
                # Lit la valeur dans un Secret du namespace.
                secretKeyRef:
                  # Nom du Secret runtime partagé par les composants.
                  name: {{ include "kbv1.secretName" . }}
                  # Clé du Secret injectée dans cette variable.
                  key: KM_AGENT_ADMIN_TOKEN
            {{- end }}
            {{- /* Injecte le jeton d’indexation uniquement si le service d’ingestion est configuré. */ -}}
            {{- if .Values.kmFrontend.env.ingestionUrl }}
            # Injecte KM_INDEXER_TOKEN depuis le Secret runtime.
            - name: KM_INDEXER_TOKEN
              # Source de cette variable, résolue par Kubernetes.
              valueFrom:
                # Lit la valeur dans un Secret du namespace.
                secretKeyRef:
                  # Nom du Secret runtime partagé par les composants.
                  name: {{ include "kbv1.secretName" . }}
                  # Clé du Secret injectée dans cette variable.
                  key: KM_INDEXER_TOKEN
            {{- end }}
            # Port utilisé par la redirection historique de la console KM.
            - name: PDFPARSE_PORT
              value: {{ .Values.kmFrontend.env.pdfparsePort | quote }}
            # Identifiant Basic Auth de KM Frontend.
            - name: KM_CONSOLE_USER
              value: {{ .Values.kmFrontend.env.consoleUser | quote }}
            # Injecte KM_CONSOLE_PASSWORD depuis le Secret runtime.
            - name: KM_CONSOLE_PASSWORD
              # Source de cette variable, résolue par Kubernetes.
              valueFrom:
                # Lit la valeur dans un Secret du namespace.
                secretKeyRef:
                  # Nom du Secret runtime partagé par les composants.
                  name: {{ include "kbv1.secretName" . }}
                  # Clé du Secret injectée dans cette variable.
                  key: KM_CONSOLE_PASSWORD
            # Identifiant natif de l’explorateur Fileserver.
            - name: FILESERVER_DEV_USER
              value: {{ .Values.fileserver.env.devUser | quote }}
            # Injecte FILESERVER_DEV_PASSWORD depuis le Secret runtime.
            - name: FILESERVER_DEV_PASSWORD
              # Source de cette variable, résolue par Kubernetes.
              valueFrom:
                # Lit la valeur dans un Secret du namespace.
                secretKeyRef:
                  # Nom du Secret runtime partagé par les composants.
                  name: {{ include "kbv1.secretName" . }}
                  # Clé du Secret injectée dans cette variable.
                  key: FILESERVER_DEV_PASSWORD
            # Injecte KM_API_TOKEN depuis le Secret runtime.
            - name: KM_API_TOKEN
              # Source de cette variable, résolue par Kubernetes.
              valueFrom:
                # Lit la valeur dans un Secret du namespace.
                secretKeyRef:
                  # Nom du Secret runtime partagé par les composants.
                  name: {{ include "kbv1.secretName" . }}
                  # Clé du Secret injectée dans cette variable.
                  key: KM_API_TOKEN
            # Injecte KM_INDEXER_ADMIN_TOKEN depuis le Secret runtime.
            - name: KM_INDEXER_ADMIN_TOKEN
              # Source de cette variable, résolue par Kubernetes.
              valueFrom:
                # Lit la valeur dans un Secret du namespace.
                secretKeyRef:
                  # Nom du Secret runtime partagé par les composants.
                  name: {{ include "kbv1.secretName" . }}
                  # Clé du Secret injectée dans cette variable.
                  key: KM_INDEXER_ADMIN_TOKEN
          # Redémarre le conteneur après des échecs répétés.
          livenessProbe:
            # Vérifie la réponse HTTP de l’application.
            httpGet:
              # Endpoint de santé contrôlé par la sonde HTTP.
              path: /health
              # Port du conteneur interrogé par la sonde.
              port: 8088
            # Délai avant le début des vérifications, en secondes.
            initialDelaySeconds: 10
            # Intervalle entre deux vérifications, en secondes.
            periodSeconds: 15
            # Délai maximal d’une vérification, en secondes.
            timeoutSeconds: 5
          # Retire le pod des endpoints du Service tant que le contrôle échoue.
          readinessProbe:
            # Vérifie la réponse HTTP de l’application.
            httpGet:
              # Endpoint de santé contrôlé par la sonde HTTP.
              path: /health
              # Port du conteneur interrogé par la sonde.
              port: 8088
            # Délai avant le début des vérifications, en secondes.
            initialDelaySeconds: 5
            # Intervalle entre deux vérifications, en secondes.
            periodSeconds: 10
            # Délai maximal d’une vérification, en secondes.
            timeoutSeconds: 5
          # Demandes et limites de ressources Kubernetes.
          resources:
            {{- toYaml .Values.kmFrontend.resources | nindent 12 }}
{{- end }}
