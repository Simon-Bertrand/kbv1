{{- if .Values.pdfparse.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kbv1.fullname" . }}-pdfparse
  labels:
    {{- include "kbv1.labels" . | nindent 4 }}
    app.kubernetes.io/component: pdfparse
spec:
  type: {{ .Values.pdfparse.service.type }}
  ports:
    - port: {{ .Values.pdfparse.service.port }}
      targetPort: 8000
      protocol: TCP
      name: http
      {{- if and (eq .Values.pdfparse.service.type "NodePort") .Values.pdfparse.service.nodePort }}
      nodePort: {{ .Values.pdfparse.service.nodePort }}
      {{- end }}
  selector:
    {{- include "kbv1.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: pdfparse
{{- end }}
