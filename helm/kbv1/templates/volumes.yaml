{{- $root := . }}
{{- $sharedClaims := dict
    "corpus" (or .Values.fileserver.enabled .Values.pdfparse.enabled .Values.indexer.enabled .Values.kmApi.enabled)
    "models" (or .Values.pdfparse.enabled .Values.encoder.enabled) }}
{{- range $name, $enabled := $sharedClaims }}
{{- $volume := index $root.Values.sharedStorage $name }}
{{- if and $enabled (eq $volume.type "pvc") (not $volume.pvcName) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "kbv1.fullname" $root }}-{{ $name }}
  labels:
    {{- include "kbv1.labels" $root | nindent 4 }}
spec:
  {{- with $volume.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: {{ $volume.size }}
{{- end }}
{{- end }}
{{- if and (eq .Values.sharedStorage.sourceVersions.type "pvc") (not .Values.sharedStorage.sourceVersions.pvcName) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "kbv1.fullname" . }}-source-versions
  labels:
    {{- include "kbv1.labels" . | nindent 4 }}
spec:
  {{- with .Values.sharedStorage.sourceVersions.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: {{ .Values.sharedStorage.sourceVersions.size }}
---
{{- end }}
{{- if and (eq .Values.sharedStorage.indexerState.type "pvc") (not .Values.sharedStorage.indexerState.pvcName) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "kbv1.fullname" . }}-indexer-state
  labels:
    {{- include "kbv1.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.sharedStorage.indexerState.size }}
---
{{- end }}
{{- if and (eq .Values.sharedStorage.pdfparseAssets.type "pvc") (not .Values.sharedStorage.pdfparseAssets.pvcName) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "kbv1.fullname" . }}-pdfparse-assets
  labels:
    {{- include "kbv1.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.sharedStorage.pdfparseAssets.size }}
---
{{- end }}
{{- if and (eq .Values.postgres.persistence.type "pvc") (not .Values.postgres.persistence.pvcName) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "kbv1.fullname" . }}-postgres-data
  labels:
    {{- include "kbv1.labels" . | nindent 4 }}
spec:
  {{- with .Values.postgres.persistence.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.postgres.persistence.size }}
{{- end }}
