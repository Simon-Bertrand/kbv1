    requests:
      # Capacité demandée au provisionneur du PVC.
      storage: {{ .Values.sharedStorage.sourceVersions.size }}
---
{{- end }}
{{- /* Utilise le stockage persistant lorsque le mode PVC est sélectionné. */ -}}
