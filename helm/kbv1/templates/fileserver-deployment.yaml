{{- /* Rend cette ressource uniquement si la fonctionnalité est activée. */ -}}
{{- if .Values.fileserver.enabled }}
{{- $fileserverHost := include "kbv1.host" (dict "root" . "name" "fileserver") -}}
{{- $webuiHost := include "kbv1.host" (dict "root" . "name" "webui") -}}
# Version de l’API utilisée pour cette ressource.
apiVersion: apps/v1
# Type de ressource que Kubernetes doit créer.
kind: Deployment
# Identité et étiquettes de la ressource.
metadata:
  # Nom de la ressource dans le namespace de la release.
  name: {{ include "kbv1.fullname" . }}-fileserver
  # Étiquettes Helm et identité de la release.
  labels:
    {{- include "kbv1.labels" . | nindent 4 }}
    # Étiquette qui distingue ce composant des autres pods de la release.
    app.kubernetes.io/component: fileserver
# Configuration souhaitée pour cette ressource.
spec:
  # Nombre de pods maintenus par le Deployment.
  replicas: 1
  # Étiquettes des pods que cette ressource sélectionne.
  selector:
    # Toutes ces étiquettes doivent correspondre au pod ciblé.
    matchLabels:
      {{- include "kbv1.selectorLabels" . | nindent 6 }}
      # Étiquette qui distingue ce composant des autres pods de la release.
      app.kubernetes.io/component: fileserver
  # Modèle de pod appliqué à chaque réplique.
  template:
    # Identité et étiquettes de la ressource.
    metadata:
      # Étiquettes Helm et identité de la release.
      labels:
        {{- include "kbv1.selectorLabels" . | nindent 8 }}
        # Étiquette qui distingue ce composant des autres pods de la release.
        app.kubernetes.io/component: fileserver
    # Configuration souhaitée pour cette ressource.
    spec:
      # Empêche le montage automatique d’un jeton d’accès à l’API Kubernetes.
      automountServiceAccountToken: false
      {{- /* Ajoute les Secrets de lecture du registre uniquement lorsqu’ils sont fournis. */ -}}
      {{- with .Values.global.imagePullSecrets }}
      # Secrets Docker utilisés par le kubelet pour accéder au registre privé.
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Conteneurs applicatifs du pod.
      containers:
        # Nom du conteneur dans le pod.
        - name: fileserver
          # Référence de l’image publiée par GitLab, avec le registre et le tag de la release.
          image: {{ include "kbv1.image" (dict "root" . "image" .Values.fileserver.image) | quote }}
          # Détermine quand le kubelet télécharge de nouveau l’image.
          imagePullPolicy: {{ .Values.fileserver.image.pullPolicy }}
          # Commande lancée dans le conteneur pour ce bloc.
          command: ["/bin/sh", "-ec"]
          # Arguments ou script transmis à la commande.
          args:
            - |
              if [ "${#FILESERVER_JWT_SECRET}" -lt 32 ] ||
                 [ "${#FILESERVER_UI_SECRET}" -lt 32 ] ||
                 [ "$FILESERVER_JWT_SECRET" = knowledgebase-default-fileserver-jwt-secret ] ||
                 [ "$FILESERVER_UI_SECRET" = knowledgebase-default-fileserver-ui-secret ]; then
                echo "Les secrets du Fileserver doivent être distincts des valeurs par défaut et contenir au moins 32 caractères" >&2
                exit 1
              fi
              if [ "$KB_ENV" = dev ]; then
                if [ "${#FILESERVER_DEV_PASSWORD}" -lt 16 ]; then
                  echo "FILESERVER_DEV_PASSWORD doit contenir au moins 16 caractères" >&2
                  exit 1
                fi
                case "$FILESERVER_DEV_PASSWORD" in
                  [[:space:]]*|*[[:space:]]) exit 1 ;;
                esac
              fi
              exec /usr/local/bin/entrypoint.sh nginx -e /dev/stderr -g 'daemon off;'
          # Ports utilisés par cette ressource.
          ports:
            # Nom du port de conteneur, réutilisable par les sondes et le Service.
            - name: http
              # Port d’écoute déclaré par le conteneur.
              containerPort: 8080
              # Protocole de transport du port.
              protocol: TCP
          # Variables injectées dans le conteneur au démarrage.
          env:
            # Mode d’exécution applicatif. Le Fileserver et la console KM utilisent dev lorsque l’explorateur est publié.
            - name: KB_ENV
              value: {{ ternary "dev" "production" (and .Values.ingress.enabled .Values.ingress.fileserverExposed .Values.ingress.fileserverUi.enabled) | quote }}
            # Restreint les noms d’hôte HTTP acceptés par l’application.
            - name: ALLOWED_HOSTS
              value: {{ default (printf "%s,%s-fileserver" $fileserverHost (include "kbv1.fullname" .)) .Values.fileserver.env.allowedHosts | quote }}
            # Répertoire des anciennes versions de documents.
            - name: FILESERVER_LEGACY_VERSIONS_ROOT
              value: {{ .Values.fileserver.env.legacyVersionsRoot | quote }}
            # Origine WebUI autorisée à lire des PDF depuis le navigateur.
            - name: WEBUI_PUBLIC_ORIGIN
              value: {{ .Values.fileserver.env.webuiPublicOrigin | default (printf "https://%s" $webuiHost) | quote }}
            # Identifiant natif de l’explorateur Fileserver.
            - name: FILESERVER_DEV_USER
              value: {{ .Values.fileserver.env.devUser | quote }}
            # Injecte FILESERVER_DEV_PASSWORD depuis le Secret runtime.
            - name: FILESERVER_DEV_PASSWORD
              # Source de cette variable, résolue par Kubernetes.
              valueFrom:
                # Lit la valeur dans un Secret du namespace.
                secretKeyRef:
                  # Nom du Secret runtime partagé par les composants.
                  name: {{ include "kbv1.secretName" . }}
                  # Clé du Secret injectée dans cette variable.
                  key: FILESERVER_DEV_PASSWORD
            # Injecte FILESERVER_JWT_SECRET depuis le Secret runtime.
            - name: FILESERVER_JWT_SECRET
              # Source de cette variable, résolue par Kubernetes.
              valueFrom:
                # Lit la valeur dans un Secret du namespace.
                secretKeyRef:
                  # Nom du Secret runtime partagé par les composants.
                  name: {{ include "kbv1.secretName" . }}
                  # Clé du Secret injectée dans cette variable.
                  key: FILESERVER_JWT_SECRET
            # Injecte FILESERVER_UI_SECRET depuis le Secret runtime.
            - name: FILESERVER_UI_SECRET
              # Source de cette variable, résolue par Kubernetes.
              valueFrom:
                # Lit la valeur dans un Secret du namespace.
                secretKeyRef:
                  # Nom du Secret runtime partagé par les composants.
                  name: {{ include "kbv1.secretName" . }}
                  # Clé du Secret injectée dans cette variable.
                  key: FILESERVER_UI_SECRET
          # Redémarre le conteneur après des échecs répétés.
          livenessProbe:
            # Vérifie la réponse HTTP de l’application.
            httpGet:
              # Endpoint de santé contrôlé par la sonde HTTP.
              path: /health
              # Port du conteneur interrogé par la sonde.
              port: http
              # En-têtes HTTP envoyés par le kubelet pour cette vérification.
              httpHeaders:
                # Nom de la ressource dans le namespace de la release.
                - name: Host
                  value: {{ $fileserverHost | quote }}
            # Délai avant le début des vérifications, en secondes.
            initialDelaySeconds: 10
            # Intervalle entre deux vérifications, en secondes.
            periodSeconds: 10
            # Délai maximal d’une vérification, en secondes.
            timeoutSeconds: 5
          # Retire le pod des endpoints du Service tant que le contrôle échoue.
          readinessProbe:
            # Vérifie la réponse HTTP de l’application.
            httpGet:
              # Endpoint de santé contrôlé par la sonde HTTP.
              path: /health
              # Port du conteneur interrogé par la sonde.
              port: http
              # En-têtes HTTP envoyés par le kubelet pour cette vérification.
              httpHeaders:
                # Nom de la ressource dans le namespace de la release.
                - name: Host
                  value: {{ $fileserverHost | quote }}
            # Délai avant le début des vérifications, en secondes.
            initialDelaySeconds: 5
            # Intervalle entre deux vérifications, en secondes.
            periodSeconds: 5
            # Délai maximal d’une vérification, en secondes.
            timeoutSeconds: 3
          # Points de montage visibles dans le conteneur.
          volumeMounts:
            # Nom du volume à monter, défini dans la liste des volumes du pod.
            - name: corpus-storage
              # Emplacement du volume dans le conteneur.
              mountPath: /srv/data
              # Interdit les écritures dans ce montage.
              readOnly: true
            # Nom du volume à monter, défini dans la liste des volumes du pod.
            - name: source-versions
              # Emplacement du volume dans le conteneur.
              mountPath: /srv/source-versions
              # Interdit les écritures dans ce montage.
              readOnly: true
            # Nom du volume à monter, défini dans la liste des volumes du pod.
            - name: nginx-cache
              # Emplacement du volume dans le conteneur.
              mountPath: /var/cache/nginx
            # Nom du volume à monter, défini dans la liste des volumes du pod.
            - name: nginx-lib
              # Emplacement du volume dans le conteneur.
              mountPath: /var/lib/nginx
            # Nom du volume à monter, défini dans la liste des volumes du pod.
            - name: nginx-run
              # Emplacement du volume dans le conteneur.
              mountPath: /var/run
          # Demandes et limites de ressources Kubernetes.
          resources:
            {{- toYaml .Values.fileserver.resources | nindent 12 }}
      # Sources des volumes utilisés par le pod.
      volumes:
        # Nom du volume dans le pod.
        - name: corpus-storage
          {{- /* Utilise le stockage persistant lorsque le mode PVC est sélectionné. */ -}}
          {{- if eq .Values.sharedStorage.corpus.type "pvc" }}
          # Monte le volume persistant déclaré par un PVC.
          persistentVolumeClaim:
            # Sélectionne le PVC fourni ou le nom généré par la release.
            claimName: {{ if .Values.sharedStorage.corpus.pvcName }}{{ .Values.sharedStorage.corpus.pvcName }}{{ else }}{{ include "kbv1.fullname" . }}-corpus{{ end }}
          {{- /* Utilise le chemin local du nœud lorsque le mode hostPath est sélectionné. */ -}}
          {{- else if eq .Values.sharedStorage.corpus.type "hostPath" }}
          # Utilise un chemin local du nœud qui héberge le pod.
          hostPath:
            # Chemin utilisé par cette ressource.
            path: {{ .Values.sharedStorage.corpus.hostPath }}
            # Exige un répertoire existant sur le nœud.
            type: Directory
          {{- else }}
          # Crée un volume temporaire supprimé avec le pod.
          emptyDir: {}
          {{- end }}
        # Nom du volume dans le pod.
        - name: source-versions
          {{- /* Utilise le stockage persistant lorsque le mode PVC est sélectionné. */ -}}
          {{- if eq .Values.sharedStorage.sourceVersions.type "pvc" }}
          # Monte le volume persistant déclaré par un PVC.
          persistentVolumeClaim:
            # Sélectionne le PVC fourni ou le nom généré par la release.
            claimName: {{ if .Values.sharedStorage.sourceVersions.pvcName }}{{ .Values.sharedStorage.sourceVersions.pvcName }}{{ else }}{{ include "kbv1.fullname" . }}-source-versions{{ end }}
          {{- else }}
          # Crée un volume temporaire supprimé avec le pod.
          emptyDir: {}
          {{- end }}
        # Nom du volume dans le pod.
        - name: nginx-cache
          # Crée un volume temporaire supprimé avec le pod.
          emptyDir: {}
        # Nom du volume dans le pod.
        - name: nginx-lib
          # Crée un volume temporaire supprimé avec le pod.
          emptyDir: {}
        # Nom du volume dans le pod.
        - name: nginx-run
          # Crée un volume temporaire supprimé avec le pod.
          emptyDir: {}
{{- end }}
