{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kbv1.fullname" . }}-secrets
  labels:
    {{- include "kbv1.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | default "dev-postgres-password" | quote }}
  POSTGRES_AGENT_PASSWORD: {{ .Values.secrets.postgresAgentPassword | default "dev-agent-password-replace-in-prod" | quote }}
  POSTGRES_KM_READER_PASSWORD: {{ .Values.secrets.postgresKmReaderPassword | default "dev-km-reader-password" | quote }}
  POSTGRES_KM_WRITER_PASSWORD: {{ .Values.secrets.postgresKmWriterPassword | default "dev-km-writer-password" | quote }}
  POSTGRES_WEBUI_PASSWORD: {{ .Values.secrets.postgresWebuiPassword | default "dev-webui-password" | quote }}
  FILESERVER_JWT_SECRET: {{ .Values.secrets.fileserverJwtSecret | default "dev-fileserver-jwt-secret-very-secure-32chars" | quote }}
  FILESERVER_UI_SECRET: {{ .Values.secrets.fileserverUiSecret | default "dev-fileserver-ui-secret-key-32chars" | quote }}
  FILESERVER_DEV_PASSWORD: {{ default (.Values.secrets.fileserverDevPassword | default "dev") .Values.basicAuth.fileserver.password | quote }}
  PDFPARSE_ADMIN_PASSWORD: {{ default (.Values.secrets.pdfparseAdminPassword | default "dev-studio-password") .Values.basicAuth.pdfparse.password | quote }}
  {{- if .Values.webui.enabled }}
  {{- if eq .Values.webui.env.authMode "oidc" }}
  WEBUI_AUTH_OIDC_ISSUER: {{ required "secrets.webuiOidcIssuer est obligatoire" .Values.secrets.webuiOidcIssuer | quote }}
  WEBUI_AUTH_OIDC_ID: {{ required "secrets.webuiOidcId est obligatoire" .Values.secrets.webuiOidcId | quote }}
  WEBUI_AUTH_OIDC_SECRET: {{ required "secrets.webuiOidcSecret est obligatoire" .Values.secrets.webuiOidcSecret | quote }}
  {{- else }}
  WEBUI_AUTH_ADMIN_LOGIN: {{ required "secrets.webuiAdminLogin est obligatoire" .Values.secrets.webuiAdminLogin | quote }}
  WEBUI_AUTH_ADMIN_PASSWORD: {{ required "secrets.webuiAdminPassword est obligatoire" .Values.secrets.webuiAdminPassword | quote }}
  {{- end }}
  {{- end }}
  WEBUI_AUTH_SECRET: {{ .Values.secrets.webuiAuthSecret | default "dev-webui-auth-secret-minimum-32-characters" | quote }}
  KM_INDEXER_TOKEN: {{ .Values.secrets.kmIndexerToken | default "" | quote }}
  KM_API_TOKEN: {{ .Values.secrets.kmApiToken | default "" | quote }}
  KM_AGENT_TOKEN: {{ .Values.secrets.kmAgentToken | default "" | quote }}
  KM_CONSOLE_PASSWORD: {{ default .Values.secrets.kmConsolePassword .Values.basicAuth.kmFrontend.password | default "" | quote }}
{{- end }}
