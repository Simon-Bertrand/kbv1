{{- if .Values.encoder.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kbv1.fullname" . }}-encoder
  labels:
    {{- include "kbv1.labels" . | nindent 4 }}
    app.kubernetes.io/component: encoder
spec:
  type: {{ .Values.encoder.service.type }}
  ports:
    - port: {{ .Values.encoder.service.port }}
      targetPort: 8001
      protocol: TCP
      name: http
      {{- if and (eq .Values.encoder.service.type "NodePort") .Values.encoder.service.nodePort }}
      nodePort: {{ .Values.encoder.service.nodePort }}
      {{- end }}
  selector:
    {{- include "kbv1.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: encoder
{{- end }}
