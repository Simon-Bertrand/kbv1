stages: [package, deploy]

variables:
  REGISTRY_PATH: "$CI_REGISTRY_IMAGE"
  PIP_INDEX_URL: "https://${GITEA_HOST}/api/packages/${GITEA_OWNER}/pypi/simple"
  VERSION: "1.0.0"
  BUILDAH_IMAGE: "${GITEA_BASE_REGISTRY}/ci-buildah:latest"
  HELM_IMAGE: "${GITEA_BASE_REGISTRY}/ci-helm:latest"
  KUBE_NAMESPACE: "kbv1"

.package-image:
  stage: package
  resource_group: kbv1-package-storage
  image: "$BUILDAH_IMAGE"
  variables:
    STORAGE_DRIVER: overlay
  before_script:
    - |
      printf '%s' "${GITEA_PAT:?Configurer GITEA_PAT}" |
        buildah login --username "${GITEA_USER:?Configurer GITEA_USER}" --password-stdin "${GITEA_BASE_REGISTRY%%/*}"
    - |
      package=${CI_JOB_NAME#package:}
      repository="$REGISTRY_PATH/km-${package#km-}"
      image="$repository:$VERSION"
      for base in $BASE_IMAGES; do
        source="$GITEA_BASE_REGISTRY/$base:latest"
        buildah pull "$source"
        buildah tag "$source" "knowledgebase/$base:local"
      done
  script:
    - 'set -- --network=none'
    - &build-and-push |
      buildah bud --format=docker --layers=false --force-rm --pull=never \
        "$@" -f "$BUILD_CONTEXT/Dockerfile" -t "$image" "$BUILD_CONTEXT"
      buildah push "$image"
      buildah push "$image" "docker://$repository:latest"
  after_script:
    - |
      package=${CI_JOB_NAME#package:}
      buildah rmi "$REGISTRY_PATH/km-${package#km-}:$VERSION" || true

.package-python:
  extends: .package-image
  script:
    - sha256sum -c docker/python/inputs.sha256
    - |
      set -- --network=host --build-context workspace=. \
        --build-arg PYTHON_INDEX_SOURCE=gitea \
        --build-arg "PIP_INDEX_URL=${PIP_INDEX_URL:?Configurer PIP_INDEX_URL}" \
        --secret id=gitea_user,env=GITEA_USER \
        --secret id=gitea_pat,env=GITEA_PAT
      test -z "${PIP_CERT:-}" || set -- "$@" --secret "id=pip_cert,src=$PIP_CERT"
      test -z "${PDFPARSE_BUILD:-}" ||
        set -- "$@" --build-arg "PDFPARSE_WHEEL_PROFILE=${PDFPARSE_WHEEL_PROFILE:-pdfparse}"
    - *build-and-push

package:postgres:
  extends: .package-image
  variables:
    BUILD_CONTEXT: packages/database
    BASE_IMAGES: "base-pg-textsearch base-pgvectorscale base-pgvector base-postgres"

package:encoder:
  extends: .package-python
  variables:
    BUILD_CONTEXT: packages/embeddings
    BASE_IMAGES: "base-python"

package:indexer:
  extends: .package-python
  variables:
    BUILD_CONTEXT: packages/embeddings/indexer
    BASE_IMAGES: "base-python"

package:fileserver:
  extends: .package-image
  variables:
    BUILD_CONTEXT: packages/fileserver
    BASE_IMAGES: "base-fileserver build-fileserver"

package:km-api:
  extends: .package-python
  variables:
    BUILD_CONTEXT: packages/km-api
    BASE_IMAGES: "base-python"

package:km-frontend:
  extends: .package-python
  variables:
    BUILD_CONTEXT: packages/km-frontend
    BASE_IMAGES: "build-km-frontend base-python"

package:pdfparse:
  extends: .package-python
  variables:
    BUILD_CONTEXT: packages/pdfparse
    PDFPARSE_BUILD: "1"
    BASE_IMAGES: "build-frontend base-python-pdf"

package:webui:
  extends: .package-image
  variables:
    BUILD_CONTEXT: packages/webui
    BASE_IMAGES: "build-webui base-webui"

deploy:preprod:
  stage: deploy
  image:
    name: "$HELM_IMAGE"
    entrypoint: [""]
  resource_group: kbv1-preprod
  environment:
    name: preprod
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: false
  script:
    - 'KUBE_PREPROD_CONTEXT="${KUBE_PREPROD_CONTEXT:-${KUBE_DEV_CONTEXT:-}}"'
    - ': "${KUBE_PREPROD_CONTEXT:?Configurer le contexte Kubernetes de préproduction}"'
    - 'KUBE_PREPROD_VALUES="${KUBE_PREPROD_VALUES:-${KUBE_DEV_VALUES:-}}"'
    - ': "${KUBE_PREPROD_VALUES:?Configurer le fichier de valeurs de préproduction}"'
    - test -r "$KUBE_PREPROD_VALUES"
    - helm lint --strict helm/kbv1 -f "$KUBE_PREPROD_VALUES" --set-string "global.imageRegistry=$REGISTRY_PATH" --set-string "global.imageTag=$VERSION"
    - helm upgrade --install kbv1 helm/kbv1 --kube-context "$KUBE_PREPROD_CONTEXT" --namespace "$KUBE_NAMESPACE" -f "$KUBE_PREPROD_VALUES" --set-string "global.imageRegistry=$REGISTRY_PATH" --set-string "global.imageTag=$VERSION" --wait --timeout 12m
