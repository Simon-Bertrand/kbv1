stages: [lint, build, package, publish, deploy-dev]

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH'

variables:
  HELM_CHART_DIR: helm/kbv1
  HELM_IMAGE: alpine/helm:3.14.3
  KUBE_NAMESPACE: kbv1
  WEBUI_DEV_URL: http://webui.kb.local

default:
  image:
    name: $HELM_IMAGE
    entrypoint: [""]

.release:
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

helm:lint:
  stage: lint
  script:
    - helm version
    - helm lint --strict "$HELM_CHART_DIR"
    - helm template test-release "$HELM_CHART_DIR" >/dev/null
    - helm template test-release "$HELM_CHART_DIR" -f "$HELM_CHART_DIR/values-nodeport.yaml" >/dev/null
    - helm template test-release "$HELM_CHART_DIR" --set-string global.imageRegistry=registry.example/kbv1,global.imageTag=test >/dev/null

images:publish:
  extends: .release
  stage: build
  tags: [kbv1-docker]
  script:
    - sh scripts/ci-publish-images.sh

helm:package:
  extends: .release
  stage: package
  script:
    - |
      set -eu
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        version=${CI_COMMIT_TAG#v}
      else
        base=$(awk '/^version:/ {print $2}' "$HELM_CHART_DIR/Chart.yaml")
        version="$base-ci.$CI_PIPELINE_IID"
      fi
      mkdir -p dist
      staging=$(mktemp -d)
      trap 'rm -rf "$staging"' EXIT
      cp -R "$HELM_CHART_DIR" "$staging/chart"
      sed -i -e 's|^  imageRegistry: ""$|  imageRegistry: "'"$CI_REGISTRY_IMAGE"'"|' \
        -e 's|^  imageTag: ""$|  imageTag: "'"$CI_COMMIT_SHA"'"|' "$staging/chart/values.yaml"
      helm package "$staging/chart" --version "$version" --app-version "$CI_COMMIT_SHA" --destination dist/
      printf 'global:\n  imageRegistry: "%s"\n  imageTag: "%s"\n' "$CI_REGISTRY_IMAGE" "$CI_COMMIT_SHA" > dist/values-images.yaml
      helm template test-release dist/*.tgz >/dev/null
  artifacts:
    paths: [dist/*.tgz, dist/values-images.yaml]
    expire_in: 1 week

helm:publish:package-registry:
  extends: .release
  stage: publish
  needs: [helm:package]
  script:
    - |
      set -eu
      set -- dist/*.tgz
      curl --fail --show-error --request POST \
        --user "gitlab-ci-token:$CI_JOB_TOKEN" --form "chart=@$1" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/helm/api/stable/charts"

helm:publish:oci:
  extends: .release
  stage: publish
  needs: [helm:package]
  script:
    - |
      set -eu
      printf '%s\n' "$CI_REGISTRY_PASSWORD" | helm registry login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
      set -- dist/*.tgz
      helm push "$1" "oci://$CI_REGISTRY_IMAGE/charts"

deploy:dev:
  stage: deploy-dev
  needs: [helm:package, helm:publish:package-registry, helm:publish:oci]
  resource_group: kbv1-dev
  environment:
    name: dev
    url: $WEBUI_DEV_URL
  script:
    - |
      set -eu
      : "${KUBE_DEV_CONTEXT:?Configurer le contexte Kubernetes dev}"
      : "${KUBE_DEV_VALUES:?Configurer une variable GitLab de type fichier pour les valeurs du site}"
      test -r "$KUBE_DEV_VALUES"
      set -- dist/*.tgz
      helm upgrade --install kbv1 "$1" \
        --kube-context "$KUBE_DEV_CONTEXT" --namespace "$KUBE_NAMESPACE" \
        -f "$KUBE_DEV_VALUES" -f dist/values-images.yaml \
        --set secrets.create=false --set global.requireExternalSecret=true \
        --atomic --wait --timeout 12m
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: false
